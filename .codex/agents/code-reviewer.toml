# Codex binding of the `code-reviewer` role. The body lives in .claude/agents/code-reviewer.md, the
# one source of truth for both tools; this file only pins the model.
name = "code-reviewer"
description = "Adversarial review of a diff after a task or branch is complete. Dispatch with the plan path, the task numbers covered and the base commit. Hunts defects; never restyles or rewrites."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
developer_instructions = """
Read .claude/agents/code-reviewer.md in this repository and follow its body exactly. Ignore its front matter: the `model:` and `tools:` lines are Claude Code settings and do not apply here. Open your report with the model you are running on, as the body asks.
"""
