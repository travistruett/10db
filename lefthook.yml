# Local git hooks: fast feedback only. Every rule here has a required CI twin (the policy and gate
# jobs in .github/workflows/ci.yml), because anyone can skip a hook.
pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --no-banner --redact .
    - name: hygiene
      run: node scripts/hooks/hygiene.mjs {staged_files}
    - name: prettier
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    - name: eslint
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    - name: cargo-fmt
      glob: '*.rs'
      run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: no-push-to-main
      run: node scripts/hooks/pre-push.mjs
      use_stdin: true
    # Git exports GIT_DIR (an absolute path when pushing from a linked worktree), GIT_PREFIX and,
    # after `git -c`, GIT_CONFIG_PARAMETERS to hooks. make check runs tests that create throwaway
    # repositories; with these set, their git would write to this checkout instead. These are the
    # variables `git rev-parse --local-env-vars` lists. The pre-commit jobs keep them: they read
    # the index, which may be a temporary one named by GIT_INDEX_FILE.
    - name: check
      run: >-
        env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR -u GIT_PREFIX
        -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_IMPLICIT_WORK_TREE
        -u GIT_CONFIG -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_GRAFT_FILE
        -u GIT_NO_REPLACE_OBJECTS -u GIT_REPLACE_REF_BASE -u GIT_SHALLOW_FILE
        make check
