[package]
name = "tendb-desktop"
version = "0.2.0"
description = "10db desktop shell"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[lib]
name = "tendb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }

[lints.rust]
# Denied, not forbidden: dictation.rs allows its one AppKit call.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Module names repeat in type names here (connection::DaemonConnection) by design.
module_name_repetitions = "allow"
