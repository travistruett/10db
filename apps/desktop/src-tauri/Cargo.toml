[package]
name = "tendb-desktop"
version = "0.1.0"
description = "10db desktop shell"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[lib]
name = "tendb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Module names repeat in type names here (connection::DaemonConnection) by design.
module_name_repetitions = "allow"
