[package]
name = "tendb-desktop"
version = "0.0.0"
description = "10db desktop shell"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[lib]
name = "tendb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
