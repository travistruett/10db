packages:
  - apps/*
  - packages/*
  - tests/*
saveExact: true
engineStrict: true
# Supply chain: hold every version for a day after it is published, and run install scripts only
# for packages listed in allowBuilds. An unlisted package with an install script fails the install.
minimumReleaseAge: 1440
strictDepBuilds: true
allowBuilds:
  # Its install script fetches the platform binary.
  esbuild: true
  # Its postinstall installs git hooks; the root prepare script does that instead.
  lefthook: false
# eslint-plugin-jsx-a11y 6.10.2 declares peer eslint up to ^9. eslint.config.js wraps it with
# @eslint/compat's fixupPluginRules, which shims the context APIs ESLint 10 removed.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
# The Agent SDK's bundled claude binaries. 10db always runs the builder's installed claude.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl'
  - '@anthropic-ai/claude-agent-sdk-linux-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64'
  - '@anthropic-ai/claude-agent-sdk-win32-x64'
