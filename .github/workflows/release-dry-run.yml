name: release-dry-run

on:
  # The app follows main by itself and installs this build of each new commit. Building at the
  # merge keeps it ready by the time the app looks. A build that is running is never cancelled
  # (see the concurrency group below).
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One build per branch runs and at most one waits. A newer push replaces the build still waiting,
# so merges every few minutes against a 15-minute build don't pile up. cancel-in-progress stays
# false: a running build always finishes, and install-app.sh installs the newest commit whose
# build has finished instead of waiting for the head's. Never set it to true.
concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          cache: false
          install_args: node pnpm rust
      - run: pnpm install --frozen-lockfile
      - name: Check that the version files agree
        run: node scripts/release/check-version.mjs "$(node -p "require('./package.json').version")"
      - run: bash scripts/release/build-macos.sh unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-dmg
          path: dist/release/
          retention-days: 7
          if-no-files-found: error
