name: release-dry-run

on:
  workflow_dispatch:

permissions: {}

jobs:
  dry-run:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.11
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check that the version files agree
        run: node scripts/release/check-version.mjs "$(node -p "require('./package.json').version")"
      - run: bash scripts/release/build-macos.sh unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-dmg
          path: dist/release/
          retention-days: 7
          if-no-files-found: error
