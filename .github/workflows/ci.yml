name: ci

on:
  push:
    branches: [main]
  pull_request:
    # edited re-runs the checks when the title changes: squash merge makes the title the commit on
    # main, so policy must lint the current one. Every job runs on every event. A job skipped on
    # edited would count as passing and replace an earlier red result for the same commit.
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # The runner image ships cargo, but the Tauri crate needs WebKitGTK to build on Linux.
      # Rust is checked in the desktop job on macOS.
      GATE_SKIP_RUST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          # gate.sh runs all of tests/repo: the hook and policy tests spawn gitleaks, actionlint and
          # zizmor, and mise-action creates shims only for installed tools.
          install_args: node pnpm gitleaks actionlint zizmor
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @10db/desktop exec playwright install --with-deps webkit
      - run: bash scripts/gate.sh
      - if: failure()
        run: for f in .gate/*.log; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done

  desktop:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: node pnpm rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: make rust-check
      - run: pnpm --filter @10db/desktop tauri build --no-bundle

  policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: node pnpm rust gitleaks actionlint zizmor
      - run: pnpm install --frozen-lockfile
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Secrets, hygiene and workflow lint over the pushed commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/policy.sh "$BASE_SHA" "$HEAD_SHA"
      - run: pnpm -s format:check
      - run: pnpm -s lint
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, EUPL-1.2, OSL-3.0

  cargo-deny:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: rust cargo-deny
      - run: make deny
