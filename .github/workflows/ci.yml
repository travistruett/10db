name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Only pull requests into main: each task's pull request goes to main and runs CI there, with no
    # integration branch in between (decisions/2026-11-02-merge-queue.md).
    branches: [main]
    # edited re-runs the checks when the title changes: squash merge makes the title the commit on
    # main, so policy must lint the current one. Every job runs on every event. A job skipped on
    # edited would count as passing and replace an earlier red result for the same commit. The one
    # job that can be skipped, desktop, is skipped by the pull request's files and never by the
    # event, so an edited event decides as the last push did.
    types: [opened, synchronize, reopened, edited]
  # Inert while main has no merge queue (decisions/2026-11-02-main-has-no-merge-queue.md); kept for
  # when an organization move brings it back. A queue builds a gh-readonly-queue/main/... branch of
  # each pull request on top of those ahead of it and waits for the required checks on it. Every
  # required job runs here; dependency-review is skipped by its `if`, which counts as passing. The
  # title lint is pull_request only: a queue entry has no title to lint.
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  # By pull request number, not ref alone: an edit to a merged pull request runs with main's ref, and
  # would otherwise cancel main's own run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The gate is split so that a pull request gets its first failure in minutes and each job can be
  # rerun alone (decisions/2026-11-06-ci-splits-the-gate-into-required-jobs.md). Each job is a required
  # check of its own, so 10db reads the failing job's log and cancelled state directly. Format and
  # lint run in policy, and Rust in desktop; `make gate` still runs every step in one place.
  gate-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GATE_STEPS: typecheck build drift knip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/gate.sh
      - if: failure()
        run: for f in .gate/*.log; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done

  gate-test:
    name: gate-test-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # One failing shard must not cancel the others: a fix session reads every failure at once.
      fail-fast: false
      matrix:
        # The ruleset requires one check per shard, so a new shard count is a ruleset change.
        shard: [1, 2, 3, 4, 5, 6]
    # Microsoft's Playwright image for the version pnpm-lock.yaml pins ships WebKit and its system
    # libraries, so no run downloads them from the Ubuntu mirror; bump the tag and digest with
    # @playwright/test. uid 1001 is the runner user that owns the checkout, so git trusts it
    # without safe.directory, which the tests' isolated git config would hide. --init reaps the
    # orphaned processes the recovery tests wait on. The image's git is 2.43.0, older than the 2.50
    # developers run, so .claude/rules/testing.md lists the git config the fixtures must set.
    container: &playwright
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --user 1001
    env:
      GATE_STEPS: test
      GATE_TEST_ARGS: --shard=${{ matrix.shard }}/6
      TENDB_TEST_TIMINGS: .gate/test-timings.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          # tests/repo runs here: the hook and policy tests spawn gitleaks, actionlint and zizmor, and
          # mise-action creates shims only for installed tools.
          install_args: node pnpm gitleaks actionlint zizmor
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/gate.sh
      - if: failure()
        run: for f in .gate/*.log; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
      # What test-report reads, on pull requests and, as the baseline, on main. This job is a
      # required check, so an upload that fails must not fail it. overwrite lets a rerun of the
      # job upload again.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-${{ matrix.shard }}
          path: .gate/test-timings.json
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  gate-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container: *playwright
    env:
      GATE_STEPS: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/gate.sh
      - if: failure()
        run: for f in .gate/*.log; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Decides whether desktop needs a macOS runner, from the pull request's files alone
  # (scripts/desktop-scope.mjs; decisions/2026-11-04-desktop-runs-on-macos-only-when-its-files-change.md).
  # It reads no event action, so an edited event decides as the last push did.
  desktop-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-scope.mjs

  desktop:
    needs: desktop-scope
    # The required check. Skipped when no file of the pull request can affect it, which GitHub counts
    # as passing, and without taking a macOS runner. Runs when desktop-scope failed or was skipped
    # (its output is then empty), so a broken decision never hides a build. !cancelled() lets it
    # evaluate after a failed need, which a plain `if` would not.
    if: ${{ !cancelled() && needs.desktop-scope.outputs.desktop != 'false' }}
    runs-on: macos-15
    # A cold Rust cache rebuilds the Tauri crate and its dependencies.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: node pnpm rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # The gate jobs run on Linux, where the real Seatbelt tests skip: run them (the gate's and a repo
      # MCP server's), with the sandbox module's own tests, on macOS.
      - run: pnpm --filter @10db/daemon exec vitest run test/gate-sandbox.seatbelt.test.ts test/mcp-sandbox.seatbelt.test.ts src/sandbox
      # The self-update against macOS's own pgrep and pkill, which neither Linux nor a lane's sandbox has.
      - run: pnpm exec vitest run --project repo tests/repo/src/self-update-real-processes.test.ts
      - run: make rust-check
      - run: pnpm --filter @10db/desktop tauri build --no-bundle

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: node pnpm rust gitleaks actionlint zizmor
      - run: pnpm install --frozen-lockfile
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Secrets, hygiene and workflow lint over the pushed commits
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/policy.sh "$BASE_SHA" "$HEAD_SHA"
      # Run even after an earlier step failed: these are the gate's format and lint, and a fix session
      # reads every failure at once.
      - if: ${{ !cancelled() }}
        run: pnpm -s format:check
      - if: ${{ !cancelled() }}
        run: pnpm -s lint
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  dependency-review:
    # The action diffs a pull request's dependencies; a merge queue entry has none. A required check
    # skipped by its `if` counts as passing, and the pull request already ran it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, EUPL-1.2, OSL-3.0
          # Dual-licensed (BSD-3-Clause OR GPL-2.0), and the deny list matches either branch of an OR.
          # 10db takes it under BSD-3-Clause; the sandbox runtime needs it.
          allow-dependencies-licenses: pkg:npm/node-forge

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: rust cargo-deny
      - run: make deny

  # Comments on a pull request with its tests added, seconds added and test lines per code line
  # (decisions/2026-11-06-pull-requests-report-their-test-cost.md). Informational: no ruleset
  # requires either job. Every step continues on error rather than the job, so a failure can't show
  # as a failed check, which 10db's checks summary reads. The work is split because a lane writes
  # the code this job runs: it gets a read-only token, and the one job with write access runs
  # nothing from the checkout. A fork's token could not comment.
  test-report:
    needs: gate-test
    # An edit to a merged pull request runs on main's ref, where HEAD^1 is not its base.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Finds which runs on main are ancestors of the pull request's base.
          fetch-depth: 0
          persist-credentials: false
      - continue-on-error: true
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: node pnpm
      - continue-on-error: true
        run: pnpm install --frozen-lockfile
      - continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-timings-*
          path: ${{ runner.temp }}/test-timings
      - name: Write the report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TIMINGS_DIR: ${{ runner.temp }}/test-timings
        run: node scripts/test-report.mjs > "$RUNNER_TEMP/test-report.md"
      - continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: ${{ runner.temp }}/test-report.md
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1

  test-report-post:
    needs: test-report
    if: ${{ !cancelled() && needs.test-report.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report
          path: ${{ runner.temp }}/test-report
      - name: Update the comment, or add it
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: <!-- 10db:test-report -->
        run: |
          body="$RUNNER_TEMP/test-report/test-report.md"
          [ -s "$body" ] || exit 0
          comments="repos/$REPOSITORY/issues/$PR_NUMBER/comments"
          # Not piped: a failed read must stop here, or it would add a second comment.
          found=$(gh api --paginate "$comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id')
          existing=${found%%$'\n'*}
          jq -Rs '{body: .}' "$body" > "$RUNNER_TEMP/comment.json"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" --input "$RUNNER_TEMP/comment.json" > /dev/null
          else
            gh api -X POST "$comments" --input "$RUNNER_TEMP/comment.json" > /dev/null
          fi
