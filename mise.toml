# Pinned toolchain for everything that isn't an npm package. Local setup and CI both install from
# this file; mise.lock records each download's checksum per platform.
min_version = "2026.10.10"

[tools]
node = "26.12.0"
pnpm = "12.13.0"
rust = { version = "1.99.1", components = ["clippy", "rustfmt"], profile = "minimal" }
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
cargo-deny = "0.20.2"

[settings]
lockfile = true
